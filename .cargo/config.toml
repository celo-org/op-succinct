[env]
# Keep the default proxy first, with a fallback for unavailable pinned modules.
# Go's module checksums and checksum database verification remain enabled.
GOPROXY = "https://proxy.golang.org,https://goproxy.cn,direct"

# 18.6.1 bundles its runtime libraries (libxml2.so.2, ICU 72) next to the binaries,
# so it does not depend on the host's libxml2 (Ubuntu 26.04 ships only libxml2.so.16).
# Its archive uses hard links, which postgresql_archive >= 0.22 extracts.
POSTGRESQL_VERSION = "=18.6.1"
