base:
  name: op-succinct
  url: https://github.com/succinctlabs/op-succinct
  # Not really the latest commit from upstream, as we cherry picked it, but
  # it's a good commit to diff from since there is only one commit between the
  # cherry picked commits and the last upstream merge commit and that commit
  # only changes documentation.
  hash: 47c3c63a3985597a92e7882dec6c05a7f81c0641 
fork:
  name: celo op-succinct
  url: git@github.com:celo-org/op-succinct.git
  ref: refs/heads/develop
def:
    title: "op-succinct Fork diff"
    description: | # description in markdown
      Displays a diff that can be used for auditing, "Other changes" and "Ignored changes" should not be included in the audit.
    globs:
      - "**/*.rs"
      - "contracts/**/*.sol"
# files can be ignored globally, these will be listed in a separate grayed-out section,
# and do not count towards the total line count.
ignore:
  - "contracts/lib/**"
  - ".github/**"
  - ".env.example"
  - "CONTRIBUTING.md"
  - "book/**"

